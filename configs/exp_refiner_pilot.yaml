# Two-stage pilot (user request 2026-10-08, after research/logs/2026-10-08_two_stage_headroom.md): a ResNet34 U-Net
# refines each kept component of exp079 (DML ResNeXt50 + B4, merge 0, GBDT) from a 384 px native-resolution crop
# (flat image, stage-1 probability, seed) to the instance-level soft target. The kept set is unchanged; only masks change.
