# Weight EMA (HuBMAP-vasculature 1st: "most crucial"; research/intel/2026-10-03_similar_competitions.md #1):
# prediction with an exponential moving average of the weights, decay 0.999 (~2 epochs of 565 steps at 2048 tiles).
