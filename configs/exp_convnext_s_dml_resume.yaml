# Resume of exp103 (configs/exp_convnext_s_dml.yaml, ConvNeXt-S DML, seed 42) after it was stopped deliberately at the end
# of fold 0 (10/07 10:30) to relaunch the run outside the Claude app's job object (app auto-updates killed two runs).
# Identical settings; fold 0 is loaded from outputs/exp103-full-part/weights and re-predicted (OOF + test), folds 1-4 are
# trained with the same fold seeds (seed + fold). Fold 0 PQ before the stop: 0.4431.
model:
  encoder: tu-convnext_small
  grad_checkpointing: true
train:
  resume_from: exp103-full-part
